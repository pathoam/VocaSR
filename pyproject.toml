[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voca"
version = "2.0.0"
description = "Privacy-focused, self-hostable speech recognition platform with native apps and remote access"
authors = [{name = "Voca"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
keywords = ["voice", "speech", "transcription", "whisper", "asr", "hotkey", "productivity", "self-hosted", "privacy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Office/Business",
    "Topic :: Utilities",
]
dependencies = [
    "sounddevice>=0.4.6",
    "numpy>=1.24.0",
    "pynput>=1.7.6",
    "pyperclip>=1.8.2",
    "pystray>=0.19.4",
    "Pillow>=10.0.0",
    "faster-whisper>=0.10.0",
    "openai>=1.3.0",
    "packaging>=23.0",
    "PyQt6>=6.5.0",
    "requests>=2.31.0",
    "qwen-asr>=0.0.6",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.0.0"]
streaming = ["vllm==0.14.0"]
api = ["fastapi>=0.104.0", "uvicorn[standard]>=0.24.0"]

[project.scripts]
voca = "voca.main:main"

[project.urls]
Homepage = "https://vocasr.com"
Repository = "https://github.com/voca/voca"
Documentation = "https://vocasr.com/docs"
"Bug Reports" = "https://github.com/voca/voca/issues"

[tool.hatch.build.targets.wheel]
packages = ["voca"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests requiring external services",
]
addopts = "--strict-markers"
xfail_strict = true

[tool.uv]
dev-dependencies = [
    "pyinstaller>=6.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=7.1.0",
]
